{% load static %}
<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Hug Kerb{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "Noto Sans Lao", sans-serif;
        background: linear-gradient(160deg, #0b0f19 0%, #131b2e 60%, #1e293b 100%);
        color: #f8fafc; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        padding: 20px 16px 40px;
    }
    .wrap { width: 100%; max-width: 430px; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand h1 { color: #38bdf8; font-size: 26px; letter-spacing: .02em; }
    .brand p { color: #94a3b8; font-size: 13px; }
    .card {
        background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px; padding: 20px; margin-bottom: 16px;
        backdrop-filter: blur(10px);
    }
    .mono { font-family: "JetBrains Mono", monospace; }
    .muted { color: #94a3b8; font-size: 13px; }
    a { color: #38bdf8; }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <h1>HUG KERB 👟</h1>
            <p>Shoe Cleaning &amp; Care — Savannakhet</p>
        </div>
        {% block content %}{% endblock %}
        <p class="muted" style="text-align:center;margin-top:24px;">© Hug Kerb · ຂອບໃຈທີ່ໃຊ້ບໍລິການ 🙏</p>
    </div>
</body>
</html>
